services:
  mattermost:
    # Usamos la 9.5 para que pgloader no falle al migrar
    image: mattermost/mattermost-team-edition:9.5
    container_name: mattermost
    ports:
      - "8065:8065"
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:Postgres_Seguro_2024!@mattermost-postgres:5432/mattermost?sslmode=disable
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
    networks:
      - mattermost_network
    depends_on:
      - mattermost-postgres
    restart: unless-stopped

  mattermost-postgres:
    image: postgres:15-alpine
    container_name: mattermost-postgres
    environment:
      - POSTGRES_USER=mmuser
      - POSTGRES_PASSWORD=Postgres_Seguro_2024!
      - POSTGRES_DB=mattermost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mattermost_network
    restart: unless-stopped

networks:
  mattermost_network:
    driver: bridge

volumes:
  mattermost_data:
  mattermost_logs:
  postgres_data:
