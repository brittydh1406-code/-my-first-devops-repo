name: Idempotent Mattermost Migration & Upgrade

on:
  push:
    branches: [ "migration" ]
  workflow_dispatch:

jobs:
  migrate-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Migration Status
        id: check_status
        run: |
          if [ -f "$HOME/.mattermost_migration_completed" ]; then
            echo "Database already migrated. Skipping."
            echo "already_migrated=true" >> $GITHUB_OUTPUT
          else
            echo "Migration required."
            echo "already_migrated=false" >> $GITHUB_OUTPUT
          fi

      - name: Backup Legacy MySQL
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker exec mattermost-mysql mysqldump -u root -p"${{ secrets.DB_MYSQL_ROOT_PASSWORD }}" mattermost > mattermost_mysql_backup_${{ github.run_id }}.sql

      - name: Start Target PostgreSQL
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker compose -f docker-compose.prod.yml up -d mattermost-postgres
          sleep 15

      - name: Run pgloader Migration
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          cat > migration.load << LOADEOF
          LOAD DATABASE
            FROM mysql://root:${{ secrets.DB_MYSQL_ROOT_PASSWORD }}@mattermost-mysql:3306/mattermost
            INTO postgresql://mmuser:${{ secrets.DB_POSTGRES_PASSWORD }}@mattermost-postgres:5432/mattermost
          WITH include drop, create tables, create indexes, reset sequences,
               workers = 4, concurrency = 1
          SET maintenance_work_mem to '128MB',
              work_mem to '12MB';
          LOADEOF

          # Usamos la red mattermost_net que definimos en los compose
          docker run --rm --network mattermost_net -v $(pwd)/migration.load:/migration.load mattermost/mattermost-pgloader:latest pgloader /migration.load

      - name: Mark Migration as Completed
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          touch $HOME/.mattermost_migration_completed

      - name: Stop Legacy Stack
        run: docker compose -f legacy/docker-compose.yml down

      - name: Deploy Upgraded Stack
        run: docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Run Health Checks
        run: |
          sleep 20
          if curl -f http://localhost:8065/api/v4/system/ping; then
            echo "✅ Mattermost upgraded successfully and running on Postgres!"
          else
            exit 1
          fi
