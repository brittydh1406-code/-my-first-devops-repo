name: Idempotent Mattermost Migration & Upgrade
on:
  push:
    branches: [ "migration" ]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  migrate-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Migration Status
        id: check_status
        run: |
          if [ -f "$HOME/.mattermost_migration_completed" ]; then
            echo "✓ Database already migrated to PostgreSQL. Skipping data transfer."
            echo "already_migrated=true" >> $GITHUB_OUTPUT
          else
            echo "⚠ Migration required."
            echo "already_migrated=false" >> $GITHUB_OUTPUT
          fi

      - name: Backup Legacy MySQL
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          echo "Creating timestamped backup of MySQL..."
          BACKUP_NAME="mattermost_mysql_backup_${{ github.run_id }}.sql"
          if docker ps | grep -q "mattermost-mysql"; then
            docker exec mattermost-mysql mysqldump -u root -p${{ secrets.DB_MYSQL_ROOT_PASSWORD }} mattermost > $BACKUP_NAME
            echo "Backup successfully saved as ${BACKUP_NAME}"
          else
            echo "Error: Legacy MySQL container is not running!"
            exit 1
          fi

      - name: Start Target PostgreSQL
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} up -d mattermost-postgres
          echo "Waiting for PostgreSQL to initialize..."

      - name: Run pgloader Migration
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          # Obtenemos la IP de la red a la que pertenece MySQL (la red mattermost_network)
          MYSQL_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mattermost-mysql)
          echo "La IP de MySQL es: $MYSQL_IP"

          # Creamos el archivo usando printf para evitar problemas con los saltos de línea
          printf "LOAD DATABASE\n" > migration.load
          printf "  FROM mysql://root:${{ secrets.DB_MYSQL_ROOT_PASSWORD }}@%s:3306/mattermost\n" "$MYSQL_IP" >> migration.load
          printf "  INTO postgresql://mmuser:${{ secrets.DB_POSTGRES_PASSWORD }}@localhost:5432/mattermost\n" >> migration.load
          printf "WITH include drop, create tables, create indexes, reset sequences,\n" >> migration.load
          printf "     workers = 4, concurrency = 1\n" >> migration.load
          printf "SET maintenance_work_mem to '128MB',\n" >> migration.load
          printf "    work_mem to '12MB';\n" >> migration.load

          # Ejecutamos pgloader
          docker run --rm \
            --network container:mattermost-postgres \
            -v "$(pwd)/migration.load:/migration.load" \
            mattermost/mattermost-pgloader:latest \
            pgloader /migration.load

      - name: Mark Migration as Completed
        if: steps.check_status.outputs.already_migrated == 'false'
        run: touch $HOME/.mattermost_migration_completed

      - name: Deploy Upgraded Stack
        run: |
          echo "Launching Upgraded Mattermost Stack..."
          docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans
          echo "Waiting for Mattermost to apply internal database updates..."
          sleep 30

      - name: Run Health Checks & Verify Data
        run: |
          echo "Running Smoke Tests..."
          if curl -f http://localhost:8065/api/v4/system/ping; then
            echo "✓ Mattermost upgraded successfully and running on Postgres!"
          else
            echo "Application health check failed. Fetching logs..."
            docker compose -f ${{ env.COMPOSE_FILE }} logs
            exit 1
          fi
